<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGEE AI — Intelligent Assistant</title>
<style>
    :root {
        --bg-sidebar: #202123;
        --bg-main: #343541;
        --bg-bubble-user: #343541;
        --bg-bubble-ai: #444654;
        --text-main: #ececf1;
        --text-muted: #8e8ea0;
        --border: #4d4d4f;
        --accent: #10a37f;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    /* Logo Animations */
    @keyframes logoFloat { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-10px) rotate(-2deg); } }
    @keyframes logoFloatRight { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-10px) rotate(2deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* Sidebar */
    .sidebar { width: 260px; background: var(--bg-sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--border); transition: transform 0.3s; z-index: 10; }
    .sidebar-header { padding: 15px; }
    .new-chat-btn { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--border); color: #fff; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 14px; transition: 0.2s; }
    .new-chat-btn:hover { background: rgba(255,255,255,0.1); }
    .chat-history { flex: 1; overflow-y: auto; padding: 10px; }
    .history-item { padding: 10px; border-radius: 6px; cursor: pointer; font-size: 14px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: 0.2s; }
    .history-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
    .sidebar-footer { padding: 15px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-muted); text-align: center; }

    /* Main Chat */
    .main-chat { flex: 1; display: flex; flex-direction: column; position: relative; }
    .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    
    /* Welcome Screen */
    .welcome-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; width: 100%; animation: fadeIn 0.8s ease; }
    .logo-container { display: flex; gap: 20px; align-items: center; justify-content: center; margin-bottom: 20px; }
    .igee-logo-3d { width: 90px; height: 90px; border-radius: 22px; display: flex; align-items: center; justify-content: center; position: relative; background: linear-gradient(180deg,#4A90E2 0%,#1877F2 50%,#0C5CBF 100%); box-shadow: 0 8px 24px rgba(24,119,242,.4); overflow: hidden; animation: logoFloat 3s ease-in-out infinite; }
    .ai-logo-3d { width: 90px; height: 90px; border-radius: 22px; display: flex; align-items: center; justify-content: center; position: relative; background: linear-gradient(180deg,#9c27b0 0%,#673ab7 50%,#311b92 100%); box-shadow: 0 8px 24px rgba(156,39,176,.4); overflow: hidden; animation: logoFloatRight 3s ease-in-out infinite; animation-delay: 0.5s; }
    .igee-logo-3d::before, .ai-logo-3d::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%; background: linear-gradient(180deg, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 100%); border-radius: 22px 22px 50% 50%; pointer-events: none; }
    .igee-logo-3d svg, .ai-logo-3d svg { width: 100%; height: 100%; position: relative; z-index: 1; }
    .welcome-title { font-size: 24px; font-weight: 600; margin-bottom: 10px; color: #fff; }
    .welcome-subtitle { font-size: 14px; color: var(--text-muted); text-align: center; max-width: 400px; }

    /* Message Bubbles */
    .message { width: 100%; max-width: 800px; padding: 20px; display: flex; gap: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .message.user { background: var(--bg-bubble-user); }
    .message.ai { background: var(--bg-bubble-ai); }
    .avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; }
    .user .avatar { background: #1877f2; color: #fff; }
    .ai .avatar { background: var(--accent); color: #fff; }
    .message-content { flex: 1; line-height: 1.6; font-size: 15px; white-space: pre-wrap; word-wrap: break-word; }

    /* Miniatures des fichiers & Images générées */
    .chat-thumbnail { max-width: 250px; max-height: 250px; border-radius: 10px; margin-bottom: 10px; display: block; object-fit: cover; border: 1px solid var(--border); }
    .pdf-thumbnail { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.1); padding: 10px 15px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; border: 1px solid var(--border); color: #fff; }
    
    /* Conteneur d'image générée avec bouton de téléchargement */
    .generated-image-container { position: relative; display: inline-block; margin-top: 10px; margin-bottom: 10px; }
    .generated-image-container img { max-width: 100%; border-radius: 10px; display: block; border: 1px solid var(--border); }
    .download-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 5px; transition: 0.2s; backdrop-filter: blur(4px); }
    .download-btn:hover { background: rgba(0,0,0,0.9); }

    /* Input Area */
    .input-area { padding: 20px; background: var(--bg-main); display: flex; flex-direction: column; align-items: center; width: 100%; }
    .input-wrapper { width: 100%; max-width: 800px; position: relative; background: var(--bg-bubble-ai); border: 1px solid var(--border); border-radius: 12px; padding: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); display: flex; align-items: flex-end; gap: 10px; }
    .attach-btn { width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 20px; transition: 0.2s; flex-shrink: 0; margin-bottom: 2px;}
    .attach-btn:hover { color: #fff; }
    .input-wrapper textarea { flex: 1; background: transparent; border: none; color: #fff; resize: none; outline: none; font-size: 16px; min-height: 24px; max-height: 200px; padding-top: 5px;}
    .send-btn { width: 32px; height: 32px; background: var(--accent); border: none; border-radius: 6px; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; flex-shrink: 0; margin-bottom: 2px;}
    .send-btn:hover { background: #0d8a6a; }
    .send-btn:disabled { background: #555; cursor: not-allowed; }
    .disclaimer { font-size: 11px; color: var(--text-muted); margin-top: 10px; text-align: center; }

    /* Loading Dots */
    .typing-dots { display: flex; gap: 4px; align-items: center; height: 24px; }
    .typing-dots span { width: 6px; height: 6px; background: #fff; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
    .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

    /* Responsive */
    @media (max-width: 768px) {
        .sidebar { position: absolute; height: 100%; transform: translateX(-100%); }
        .sidebar.active { transform: translateX(0); }
    }
</style>
<script src="config.js"></script>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="startNewChat()"><span>+</span> New chat</button>
        </div>
        <div class="chat-history" id="chat-history"></div>
        <div class="sidebar-footer">IGEE AI • Powered by AI</div>
    </div>

    <div class="main-chat">
        <div class="chat-container" id="chat-container">
            <div class="welcome-screen" id="welcome-screen">
                <div class="logo-container">
                    <div class="igee-logo-3d"><svg viewBox="0 0 512 512"><text x="256" y="295" font-family="'Segoe UI',Arial,sans-serif" font-size="170" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="-6">IGEE</text></svg></div>
                    <div class="ai-logo-3d"><svg viewBox="0 0 512 512"><text x="256" y="295" font-family="'Segoe UI',Arial,sans-serif" font-size="200" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="-6">AI</text></svg></div>
                </div>
                <h1 class="welcome-title">How can I help you today?</h1>
                <p class="welcome-subtitle">I am your intelligent assistant for research, projects, and development at IGEE.</p>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <input type="file" id="file-upload" accept="image/*,.pdf" style="display: none;" onchange="handleFileSelect(event)">
                <label for="file-upload" class="attach-btn" title="Attach an image or PDF">📎</label>
                <textarea id="prompt-input" placeholder="Ask IGEE AI a question..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
                <button class="send-btn" id="send-btn" onclick="sendMessage()">↑</button>
            </div>
            <div class="disclaimer">IGEE AI can make mistakes. Consider checking important information.</div>
        </div>
    </div>

    <script>
        const AI_BACKEND = "gemini"; 
        let currentChatId = Date.now().toString();
        let chatHistory = JSON.parse(localStorage.getItem('igee_ai_history')) || {};
        let selectedFile = null; 

        window.onload = () => { renderHistory(); autoResizeInput(); };
        function autoResizeInput() { const tx = document.getElementById('prompt-input'); tx.style.height = 'auto'; tx.style.height = (tx.scrollHeight) + 'px'; }
        document.getElementById('prompt-input').addEventListener('input', autoResizeInput);

        function fileToDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 10 * 1024 * 1024) { alert("File too large (max 10 MB)."); e.target.value = ''; return; }
            selectedFile = file;
            document.getElementById('prompt-input').placeholder = `File attached: ${file.name}`;
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        }

        async function sendMessage() {
            const input = document.getElementById('prompt-input');
            const text = input.value.trim();
            if (!text && !selectedFile) return; 

            const welcomeScreen = document.getElementById('welcome-screen');
            if (welcomeScreen) welcomeScreen.style.display = 'none';

            // Détection de la demande de génération d'image
            const isImageRequest = text.toLowerCase().includes('livre') || text.toLowerCase().includes('3d') || text.toLowerCase().includes('image') || text.toLowerCase().includes('dessine');

            let filePreviewHtml = '';
            if (selectedFile && selectedFile.type.startsWith('image/')) {
                const dataUrl = await fileToDataUrl(selectedFile);
                filePreviewHtml = `<img src="${dataUrl}" class="chat-thumbnail" alt="preview">`;
            } else if (selectedFile && selectedFile.type === 'application/pdf') {
                filePreviewHtml = `<div class="pdf-thumbnail">📄 ${selectedFile.name}</div>`;
            }

            addMessageToUI('user', text, filePreviewHtml);
            
            input.value = '';
            autoResizeInput();
            
            const historyText = selectedFile ? `📎 [File: ${selectedFile.name}] ${text}` : text;
            if (!chatHistory[currentChatId]) chatHistory[currentChatId] = [];
            chatHistory[currentChatId].push({ role: 'user', content: historyText });
            saveHistory();

            const loadingId = showLoading();
            document.getElementById('send-btn').disabled = true;
            document.getElementById('prompt-input').disabled = true;

            try {
                let response;
                if (isImageRequest) {
                    // On appelle la nouvelle fonction de génération d'image
                    const generatedImageUrl = await generateImage(text, selectedFile);
                    response = `<div class="generated-image-container">
                                    <img src="${generatedImageUrl}" alt="Generated Image">
                                    <button class="download-btn" onclick="downloadImage('${generatedImageUrl}', 'igee-ai-image.png')">⬇ Download</button>
                                </div>`;
                } else {
                    // Sinon, comportement normal (texte)
                    response = await callAI(text || "Analyze this document.", selectedFile);
                }
                
                removeLoading(loadingId);
                addMessageToUI('ai', response, '', true); // Le 4ème paramètre indique que c'est du HTML brut
                
                chatHistory[currentChatId].push({ role: 'ai', content: response });
                saveHistory();
            } catch (error) {
                removeLoading(loadingId);
                addMessageToUI('ai', "❌ Error: Unable to contact the AI. Please check your connection.");
                console.error(error);
            } finally {
                document.getElementById('send-btn').disabled = false;
                document.getElementById('prompt-input').disabled = false;
                selectedFile = null;
                document.getElementById('file-upload').value = '';
                document.getElementById('prompt-input').placeholder = "Ask IGEE AI a question...";
            }
        }

        function addMessageToUI(role, text, filePreviewHtml = '', isRawHtml = false) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `message ${role}`;
            // Si isRawHtml est vrai, on injecte directement le code (pour les images)
            const content = isRawHtml ? text : escapeHTML(text);
            div.innerHTML = `
                <div class="avatar">${role === 'user' ? 'U' : 'I'}</div>
                <div class="message-content">
                    ${filePreviewHtml}
                    ${content}
                </div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // FONCTION POUR TÉLÉCHARGER L'IMAGE
        window.downloadImage = (dataUrl, filename) => {
            const link = document.createElement('a');
            link.href = dataUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        function showLoading() {
            const container = document.getElementById('chat-container');
            const id = 'loading-' + Date.now();
            const div = document.createElement('div');
            div.className = 'message ai'; div.id = id;
            div.innerHTML = `<div class="avatar">I</div><div class="typing-dots"><span></span><span></span><span></span></div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        function removeLoading(id) { const el = document.getElementById(id); if (el) el.remove(); }
        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])); }

        // COMMUNICATION TEXTE (GEMINI FLASH)
        async function callAI(prompt, file = null) {
            if (AI_BACKEND === "gemini") {
                if (!window.GEMINI_API_KEY) throw new Error("Missing API Key.");
                const parts = [{ text: prompt }];
                if (file) {
                    const base64Data = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.readAsDataURL(file);
                        reader.onload = () => resolve(reader.result.split(',')[1]); 
                        reader.onerror = error => reject(error);
                    });
                    parts.push({ inlineData: { mimeType: file.type, data: base64Data } });
                }
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${window.GEMINI_API_KEY}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: parts }] })
                });
                if (!response.ok) throw new Error("API Error");
                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            } 
        }

        // 🚀 NOUVELLE FONCTION : GÉNÉRATION D'IMAGE (NANO BANANA 2 / GEMINI 3.1 FLASH IMAGE)
        async function generateImage(prompt, file = null) {
            if (!window.GEMINI_API_KEY) throw new Error("Missing API Key.");

            const parts = [{ text: prompt }];
            
            // Si l'utilisateur a joint une image, on l'inclut comme référence
            if (file) {
                const base64Data = await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.readAsDataURL(file);
                    reader.onload = () => resolve(reader.result.split(',')[1]); 
                    reader.onerror = error => reject(error);
                });
                parts.push({ inlineData: { mimeType: file.type, data: base64Data } });
            }

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-image-preview:generateContent?key=${window.GEMINI_API_KEY}`, {
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    contents: [{ parts: parts }],
                    generationConfig: { 
                        responseModalities: ["TEXT", "IMAGE"] // On demande du texte ET une image
                    } 
                })
            });
            
            if (!response.ok) throw new Error("Image API Error");
            const data = await response.json();
            
            // On cherche la partie de la réponse qui contient l'image
            const imagePart = data.candidates[0].content.parts.find(p => p.inlineData);
            
            if (imagePart) {
                return `data:${imagePart.inlineData.mimeType};base64,${imagePart.inlineData.data}`;
            } else {
                // Si l'IA n'a pas généré d'image (filtre de sécurité par exemple), on renvoie le texte
                const textPart = data.candidates[0].content.parts.find(p => p.text);
                throw new Error(textPart ? textPart.text : "No image generated.");
            }
        }

        function saveHistory() { localStorage.setItem('igee_ai_history', JSON.stringify(chatHistory)); renderHistory(); }

        function renderHistory() {
            const container = document.getElementById('chat-history');
            container.innerHTML = '';
            const sortedIds = Object.keys(chatHistory).sort((a,b) => b - a);
            sortedIds.forEach(id => {
                const messages = chatHistory[id];
                if (messages.length === 0) return;
                const div = document.createElement('div');
                div.className = 'history-item';
                div.textContent = messages[0].content.substring(0, 30) + '...';
                div.onclick = () => loadChat(id);
                container.appendChild(div);
            });
        }

        function startNewChat() {
            currentChatId = Date.now().toString();
            chatHistory[currentChatId] = [];
            const container = document.getElementById('chat-container');
            container.innerHTML = `
                <div class="welcome-screen" id="welcome-screen">
                    <div class="logo-container">
                        <div class="igee-logo-3d"><svg viewBox="0 0 512 512"><text x="256" y="295" font-family="'Segoe UI',Arial,sans-serif" font-size="170" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="-6">IGEE</text></svg></div>
                        <div class="ai-logo-3d"><svg viewBox="0 0 512 512"><text x="256" y="295" font-family="'Segoe UI',Arial,sans-serif" font-size="200" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="-6">AI</text></svg></div>
                    </div>
                    <h1 class="welcome-title">How can I help you today?</h1>
                    <p class="welcome-subtitle">I am your intelligent assistant for research, projects, and development at IGEE.</p>
                </div>
            `;
            renderHistory();
            if (window.innerWidth < 768) document.getElementById('sidebar').classList.remove('active');
        }

        function loadChat(id) {
            currentChatId = id;
            const container = document.getElementById('chat-container');
            container.innerHTML = '';
            chatHistory[id].forEach(msg => addMessageToUI(msg.role, msg.content, '', msg.role === 'ai' && msg.content.includes('<img')));
            if (window.innerWidth < 768) document.getElementById('sidebar').classList.remove('active');
        }
    </script>
</body>
</html>
